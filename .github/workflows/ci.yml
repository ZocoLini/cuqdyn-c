name: CI

on:
  push:
    branches: [main]
    tags: ["*/v*"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  COMPOSE_PROJECT_NAME: cuqdyn-c
  CARGO_HOME: /home/ubuntu/workspace/.cargo-home
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always
  RUN: docker compose run --rm -T cuqdyn_c

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # scripts/get_module_version.sh reads the tags

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - run: |
          echo "HOST_UID=$(id -u)" >> "$GITHUB_ENV"
          echo "HOST_GID=$(id -g)" >> "$GITHUB_ENV"

      - name: Image
        run: |
          # ghcr.io rejects uppercase, and the owner here is ZocoLini.
          IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}/ci:${{ hashFiles('Dockerfile') }}
          if docker pull -q "$IMAGE"; then
            docker tag "$IMAGE" "$COMPOSE_PROJECT_NAME-cuqdyn_c:latest"
          else
            echo "No image for this Dockerfile yet, building it."
            docker compose build
            if [ "$GITHUB_REF" = refs/heads/main ]; then
              docker tag "$COMPOSE_PROJECT_NAME-cuqdyn_c:latest" "$IMAGE"
              docker push -q "$IMAGE"
            fi
          fi

      - id: cache
        uses: actions/cache/restore@v4
        with:
          path: |
            build
            modules/cuqdyn-rs/target
            .cargo-home
          key: build-${{ hashFiles('deps.cmake', 'CMakeLists.txt', 'toolchains/*.cmake', 'modules/cuqdyn-rs/Cargo.lock') }}
          restore-keys: build-

      - name: format
        run: $RUN ./.githooks/formatter

      - name: compile
        run: |
          $RUN ./scripts/build.sh serial
          $RUN ./scripts/build.sh mpi

      - name: lint
        run: $RUN ./.githooks/linter < /dev/null

      - name: test
        run: $RUN ./scripts/test.sh

      - if: success() && github.ref == 'refs/heads/main'
        uses: actions/cache/save@v4
        with:
          path: |
            build
            modules/cuqdyn-rs/target
            .cargo-home
          key: ${{ steps.cache.outputs.cache-primary-key }}
