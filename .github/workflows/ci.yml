name: CI

on:
  push:
    branches: [main]
  pull_request:

# A second push to the same branch makes the first run pointless.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  COMPOSE_PROJECT_NAME: cuqdyn-c
  CARGO_HOME: /home/ubuntu/workspace/.cargo-home
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always
  RUN: docker compose run --rm -T cuqdyn_c

jobs:
  # clang-tidy needs compile_commands.json and the generated headers, so the
  # build has to come first. The formatter has no such dependency, but keeping
  # both halves of the lint in one job is worth more than the minutes saved by
  # splitting them.
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # scripts/get_module_version.sh reads the tags

      - id: setup
        uses: ./.github/actions/setup

      - name: Build every variant
        run: |
          ${{ env.RUN }} ./scripts/build.sh serial
          ${{ env.RUN }} ./scripts/build.sh mpi

      # Only main writes, so branches share one warm cache instead of each
      # leaving its own behind.
      - if: github.ref == 'refs/heads/main'
        uses: actions/cache/save@v4
        with:
          path: |
            build-serial
            build-mpi
            modules/cuqdyn-rs/target
            .cargo-home
          key: ${{ steps.setup.outputs.cache-primary-key }}

  lint:
    runs-on: ubuntu-latest
    needs: compile
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup

      - name: Formatting
        run: ${{ env.RUN }} ./.githooks/formatter

      - name: Linters
        run: ${{ env.RUN }} ./.githooks/linter < /dev/null

  test:
    runs-on: ubuntu-latest
    needs: compile
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup

      - name: ctest
        run: ${{ env.RUN }} ./scripts/test.sh
