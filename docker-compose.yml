services:
    cuqdyn_c:
        build: .
        # deps/misqp/gnu/libmisqp.so and deps/xml2-2.9.1 are prebuilt x86-64
        # binaries, so the image has to be amd64 even on arm64 hosts.
        platform: linux/amd64
        container_name: cuqdyn_c
        tty: true
        volumes:
            - .:/home/ubuntu/workspace
        working_dir: /home/ubuntu/workspace
        environment:
            # Passed through rather than hardcoded: CI turns incremental
            # compilation off to keep the build cache small, a developer
            # rebuilding all day wants it on.
            - CARGO_INCREMENTAL
            - CARGO_TERM_COLOR
            # Unset locally, so cargo uses the home rustup installed it into.
            # CI points it inside the workspace, which is the only directory the
            # container shares with the runner and therefore the only one that
            # can be cached between runs.
            - CARGO_HOME
